<!doctype html>
<html><head><meta charset="utf-8"><title>Icon preview</title>
<style>
  body{background:#222;color:#fff;font-family:sans-serif;display:flex;gap:40px;padding:40px;flex-wrap:wrap}
  .wrap{text-align:center}
  .box{background:#fff;border-radius:18px;width:300px;height:230px;display:flex;align-items:center;justify-content:center}
  .cap{margin-top:8px;font-size:13px;color:#bbb}
  svg{width:190px;height:190px}
  [data-hole]{stroke:#e33}
  [data-ink]{stroke:#38a}
</style></head><body>
  <div class="wrap"><div class="box"><svg id="s3d">placeholder</svg></div><div class="cap">3D</div></div>
  <div class="wrap"><div class="box"><svg id="sflm">placeholder</svg></div><div class="cap">Animazioni</div></div>
  <div class="wrap"><div class="box"><svg id="sai">placeholder</svg></div><div class="cap">AI</div></div>
<script>
function load(id,url){fetch(url).then(r=>r.text()).then(t=>{document.getElementById(id).outerHTML=t;});}
load('s3d','icon-3d.svg');load('sflm','icon-animazioni.svg');load('sai','icon-ai.svg');
</script>
</body></html>
